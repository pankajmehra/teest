name: US46449 Generate Full SPs

on:
  push:
    branches:
      - story-46449-npi-qa-fix
    paths:
      - .github/workflows/us46449-generate-full-sps.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Generate full QA-fixed stored procedures
        run: python tools/us46449_generate_full_sps.py

      - name: Commit full stored procedures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check_run_master_redcard_46449_QA_FIX.sql check_run_claimnondetail_redcard_46449_QA_FIX.sql
          git commit -m "US 46449: add full QA-fixed stored procedures"
          git push origin HEAD:story-46449-npi-qa-fix
